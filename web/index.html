<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FFBFFL Record Book</title>
    <meta
      name="description"
      content="The permanent archive and analytics hub for the FFBFFL fantasy football league: standings, records, rivalries and every result since 2019."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f2f0eb" />
    <!-- Home-screen app. Paths are relative so they resolve under the
         GitHub Pages base path and in a standalone single-file build alike. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FFBFFL" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500;1,6..72,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Companion to public/404.html: GitHub Pages has no SPA rewrite, so a
      // direct hit on /owners/jane-doe 404s. 404.html encodes the path into a
      // query string and bounces here; this restores the real URL before
      // React Router mounts. Internal navigation never touches this.
      (function () {
        var redirect = new URLSearchParams(window.location.search).get("p");
        if (redirect) {
          history.replaceState(null, "", redirect + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This archive needs JavaScript to browse. The underlying data is plain JSON
      in the <code>data/</code> folder of the repository.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
