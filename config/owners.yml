# Owner identity overrides.
#
# You usually do not need this file. Owner identity comes from ESPN member
# account GUIDs, which are stable across every season, so a team rename is
# handled automatically.
#
# Use it for three things:
#   1. Pin a proper display name (ESPN gives us whatever the person typed).
#   2. Merge two ESPN accounts that belong to one person.
#   3. Attach a team ESPN never linked to an account ("unlinked-...").
#
# The easiest way to merge: each owner's `member_hash` is in data/owners.json,
# and whenever two owners share a name the pipeline prints a ready-to-paste
# snippet in its warnings (see data/meta.json or the workflow summary).
# Raw ESPN GUIDs also work if you have them.
#
# owners:
#   - owner_id: jane-doe          # stable slug used in URLs: /owners/jane-doe
#     name: Jane Doe              # display name shown on the site
#     espn_member_hashes:         # from data/owners.json (preferred)
#       - 3f1a9c2b7d4e
#       - a81b22c9d0ef
#     espn_member_ids:            # or raw ESPN account GUIDs, if you have them
#       - "{AAAAAAAA-BBBB-CCCC-DDDD-EEEEEEEEEEEE}"
#     note: "Took over the Harbor City franchise in 2021."

owners:
  # Display-name pins. The owner_id must match the slug ESPN's name produces.
  - owner_id: mikey-fidler
    name: Mikey Fidler
  - owner_id: tyler-kuiken
    name: Tyler Kuiken

  # Jakob Frank appears twice in the ESPN data (2019 under one account,
  # 2020 onward under another). After the next refresh, data/meta.json will
  # contain a warning with his two member hashes; paste them here to merge:
  #
  # - owner_id: jakob-frank
  #   name: Jakob Frank
  #   espn_member_hashes:
  #     - <hash from the warning>
  #     - <hash from the warning>
