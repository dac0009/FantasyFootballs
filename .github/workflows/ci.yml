name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check pipeline tests scripts
      - name: Tests
        run: python -m pytest tests -q
      - name: Rebuild the sample dataset end to end
        run: python -m pipeline sample --data-dir /tmp/sample-data
      - name: Verify no credential-shaped strings in committed data
        run: |
          if grep -rEl '\{[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}\}' data/ 2>/dev/null; then
            echo "::error::An ESPN GUID is present in data/."
            exit 1
          fi
          echo "Clean."

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: Rivalry membership tests
        working-directory: web
        run: npm test
      - name: Typecheck and build
        working-directory: web
        run: npm run build
