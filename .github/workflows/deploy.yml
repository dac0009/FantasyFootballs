name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # Called by the data-refresh workflow, because a push made with
  # GITHUB_TOKEN does not itself trigger the push event above.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Check that datasets exist
        run: |
          if [ ! -f data/meta.json ]; then
            echo "::error::data/meta.json is missing, so the site would deploy with no content. Run the 'Refresh ESPN data' workflow first, or commit sample data with 'python -m pipeline sample'."
            exit 1
          fi
          echo "Datasets present: $(find data -name '*.json' | wc -l) files."

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        working-directory: web
        run: BASE_PATH="/${{ github.event.repository.name }}/" npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
